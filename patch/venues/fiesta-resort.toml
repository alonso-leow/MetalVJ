# Fiesta Resort — the production room, rebuilt from the ShowXpress show.
#
# This venue is the 3D recreation of the room the desk actually drives. It was
# read from the ShowXpress show at
#
#   <LightingController>/LightShows/LightShow_from_V5/
#     fixtures.ini          the patch: 61 entries, model + DMX address + group
#     3DView\fixtures.ini   the desk's own positions (the survey below)
#     3DView\3dview.ini     scene size 20 x 6 x 100 m, metre units
#     fixtures\*.txt        the per-model profiles
#
# Where the desk's 3D file and the room as built disagree, the room as built
# wins: the desk's positions are a fixture dump on a 100 m line, they place
# every head at one height and put the production heads 100 m out. The room
# below is dimensioned from the brief:
#
#   stage      12 m deep, 18 m wide, 1.0 m above the floor
#   truss      10 m wide, hung at 9 m, carries the rig
#   screen     3 tiles, 1024 px each, heights 256 : 1536 : 256 -> a 1024x2048
#              face, 5.05 m wide x 10.1 m tall, on the back wall
#   camera     15 m from the stage front, 3.4 m up (the production room)
#   columns    four, at the corners of the stage, one light on each
#   booth      the production room, 2 moving heads above the operator
#
# The desk's surveys are kept in each fixture's `notes` (`desk 3D: ...`) so the
# two can be compared without reopening ShowXpress.
#
# Units: metres, +y up, floor y = 0. The stage front edge is z = 0 and the
# stage runs back to z = -12; the back wall is at z = -12.6. yaw 0 looks at
# the back wall (-z), +90 looks right (+x); pitch > 0 looks up. A surface is
# origin + s*u + t*v, (0,0) top-left seen from the side that gets light.
# Fixture `at` is the light's own point in space, not an object's base.

[venue]
id = "fiesta-resort"
name = "Fiesta Resort — production room and stage"
setting = "indoor"
based_on = [
  "ShowXpress LightShow_from_V5/fixtures.ini",
  "ShowXpress LightShow_from_V5/3DView/fixtures.ini",
  "ShowXpress LightShow_from_V5/3DView/3dview.ini",
]
notes = """
Rebuilt from the Fiesta Resort's ShowXpress show. The screen is the 1024x2048
face of three 1024-px tiles (256 / 1536 / 256) on the back wall, 5.05 m wide
and 10.1 m tall so the pixels stay square. The working light is the desk's own
rig, all 61 patch entries: the CABEZA 7R heads (16 on the truss and stage,
plus the R7s), the WASH ESCENARIO washes, the PAR LED RIEL pars, the NUEVA LED
and RECTANGULO LED TECHO panels, the 12x4in1 Slim Pars (the four column
lights and the side strips), the beamZ heads, and the fog and low-fog
machines. Every fixture carries its ShowXpress DMX address and group.
"""

