# -------------------------------------------------------------- fixtures ---

# Front keys: Godox SL60II D (daylight, level only) over Bluetooth.
[[fixture]]
id = "key-1"
name = "front key 1"
kind = "wash"
profile = "godox-sl60iid"
at = [-3.0, 6.7, -0.8]
yaw = 0.0
pitch = -38.0
beam = 45.0
wire = "bluetooth"
drive = "fixed"
notes = "Daylight key on the front truss, over the downstage-left third of the deck."

[[fixture]]
id = "key-2"
name = "front key 2"
kind = "wash"
profile = "godox-sl60iid"
at = [0.0, 6.7, -0.8]
yaw = 0.0
pitch = -38.0
beam = 45.0
wire = "bluetooth"
drive = "fixed"
notes = "Daylight key centre, on the front truss."

[[fixture]]
id = "key-3"
name = "front key 3"
kind = "wash"
profile = "godox-sl60iid"
at = [3.0, 6.7, -0.8]
yaw = 0.0
pitch = -38.0
beam = 45.0
wire = "bluetooth"
drive = "fixed"
notes = "Daylight key over the downstage-right third of the deck."

# Fills/sides: Godox SL60II Bi (level + colour temperature, 2800-6500 K).
[[fixture]]
id = "fill-left"
name = "side fill left"
kind = "wash"
profile = "godox-sl60iibi"
at = [-4.3, 6.7, -0.8]
yaw = 0.0
pitch = -30.0
beam = 55.0
wire = "bluetooth"
drive = "fixed"
notes = "Bicolour fill at the left end of the front truss."

[[fixture]]
id = "fill-right"
name = "side fill right"
kind = "wash"
profile = "godox-sl60iibi"
at = [4.3, 6.7, -0.8]
yaw = 0.0
pitch = -30.0
beam = 55.0
wire = "bluetooth"
drive = "fixed"
notes = "Bicolour fill at the right end of the front truss."

# Backlights: full-RGB Godox on the rear batten, aimed down and forward at
# the performers.
[[fixture]]
id = "back-1"
name = "backlight 1"
kind = "backlight"
profile = "godox-rgb"
at = [-3.0, 7.1, -5.6]
yaw = 180.0
pitch = -45.0
beam = 40.0
wire = "bluetooth"
drive = "fixed"
notes = "RGB backlight, rear batten, aimed forward and down at whoever is at stage left."

[[fixture]]
id = "back-2"
name = "backlight 2"
kind = "backlight"
profile = "godox-rgb"
at = [0.0, 7.1, -5.6]
yaw = 180.0
pitch = -45.0
beam = 40.0
wire = "bluetooth"
drive = "fixed"
notes = "RGB backlight centre, rear batten."

[[fixture]]
id = "back-3"
name = "backlight 3"
kind = "backlight"
profile = "godox-rgb"
at = [3.0, 7.1, -5.6]
yaw = 180.0
pitch = -45.0
beam = 40.0
wire = "bluetooth"
drive = "fixed"
notes = "RGB backlight, rear batten, aimed forward and down at stage right."

# Moving heads: pan/tilt heads with beam shaping, on DMX. Four of them ride
# the comb battens. Each is one head of the venue's single `out.sacn` node;
# the venue projector addresses each after the last, so their 10-channel
# blocks never overlap.
[[fixture]]
id = "move-1"
name = "moving head 1"
kind = "moving"
profile = "moving-head-beam"
at = [-2.0, 7.1, -2.6]
yaw = 0.0
pitch = -50.0
beam = 12.0
wire = "dmx"
drive = "fixed"
notes = "Moving head on comb batten 2, downstage left."

[[fixture]]
id = "move-2"
name = "moving head 2"
kind = "moving"
profile = "moving-head-beam"
at = [2.0, 7.1, -2.6]
yaw = 0.0
pitch = -50.0
beam = 12.0
wire = "dmx"
drive = "fixed"
notes = "Moving head on comb batten 2, downstage right."

[[fixture]]
id = "move-3"
name = "moving head 3"
kind = "moving"
profile = "moving-head-beam"
at = [-2.0, 7.1, -4.6]
yaw = 0.0
pitch = -50.0
beam = 12.0
wire = "dmx"
drive = "fixed"
notes = "Moving head on comb batten 4, upstage left."

[[fixture]]
id = "move-4"
name = "moving head 4"
kind = "moving"
profile = "moving-head-beam"
at = [2.0, 7.1, -4.6]
yaw = 0.0
pitch = -50.0
beam = 12.0
wire = "dmx"
drive = "fixed"
notes = "Moving head on comb batten 4, upstage right."

