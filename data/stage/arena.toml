# Example stage venue, invented: no photo behind it. An arena rig that fills the
# common stage matrix (`metal_stage::common`) end to end: every fixture type on
# points and on lines, and pixel bars over the audience and on the walls.
#
# What this example teaches:
#
# - **Lines.** Fixtures of one type hung in a row become one line of the grid:
#   the proscenium truss (`l2.pro.x`), five trusses running front to back over
#   the stage (`l3.run.l|c|r`), a truss over the audience (`l3.house.x`), the
#   back wall (`l2.back.x`), the side walls (`l1.run.wl`, `l1.run.wr`) and a
#   floor strip along the stage edge (`l1.pro.x`).
# - **Variants.** Each line deals its fixtures alpha, beta, gamma, delta in order
#   along it, so a look can paint four colours, mirror pan/tilt, or run a wave.
# - **Pixel bars.** `pixels = N` on a `led_bar` splits it into segments the AI
#   can paint one by one (`l3.house.x.led_bar.beta.p3.hue`).
#
# Units: metres, +y up, floor y = 0, the stage front edge at z = 0, the back
# wall at z = -10. yaw 0 looks at the back wall (-z), +90 looks right (+x).

[venue]
id = "arena"
name = "Arena stage, trusses and pixel walls"
setting = "indoor"
based_on = []
notes = """
Invented. A 16 x 10 m stage with a proscenium truss at 6 m, five trusses over
the deck at 9 m, a truss over the audience, pixel bars on both side walls and
on the back wall, and a floor strip along the stage edge.
"""

