# The corpus plan: what to dance, before any node has a value.
#
# Every entry here is a PERFORMANCE, not a dataset row. Each performance
# becomes several dataset outputs for free, after filming, through
# koreo-stage: N-dancer figures (row/column/triangle/circle/square) and
# mirror links (Body::Mirror, derived not baked) multiply one recording
# into many training examples without dancing it again. That multiplier
# is not listed per-row below — apply it once, at annotation time, to
# whichever takes you choose to expand.
#
# `nodes = "pending"` on every row: this file fixes genre, tempo, effort,
# style, and difficulty target ahead of time so the only thing missing
# after filming is the node values themselves.

[metronome]
# Isolates INTENTION from geometry. No melody, no genre — a click track
# carries tempo and nothing else, on purpose (the design notes §5 Phase 2). Every
# BPM already yields all 8 Laban efforts per take, for free:
#
#   koreo-click set --bpm 60,76,96,120,144 --out data/click/
#
# Nothing to design here; run the command. Difficulty and style do not
# apply to this corpus by construction.
bpm = [60, 76, 96, 120, 144]
command = "koreo-click set --bpm 60,76,96,120,144 --out data/click/"
note = "already fully specified; the only missing thing is the operator dancing it"

# ---------------------------------------------------------------------------
# Score takes: the music -> dance mapping (the design notes Phase 2, "real songs are
# the primary examples"). Six Debussy solo-piano pieces, public domain,
# spanning tempo and character. Bring your own recording; nothing here
# names or ships an audio file.
#
# Three variants per piece:
#   a. LITERAL   — style and effort matched to the piece's own character.
#                  Low difficulty. This is the baseline reading.
#   b. CONTRAST  — a deliberately mismatched genre/effort on the same
#                  melody. This is what "even genres" asks for: it tests
#                  whether the notation can separate music from motion,
#                  not just recover the obvious reading.
#   c. STRETCH   — the literal style pushed to high difficulty: denser
#                  vocabulary, same effort/style target, harder body.
#                  Exercises the difficulty channel's range.
# ---------------------------------------------------------------------------

[[score]]
id = "clair-de-lune-a"
piece = "Clair de Lune (Suite bergamasque, III)"
character = "slow, suspended, legato"
variant = "literal"
genre = "contemporary"
style = { contemporary = 0.8, lyrical = 0.2 }
effort = ["Float", "Glide"]
difficulty = 0.2
nodes = "pending"

[[score]]
id = "clair-de-lune-b"
piece = "Clair de Lune (Suite bergamasque, III)"
character = "slow, suspended, legato"
variant = "contrast"
genre = "hip-hop"
style = { hip_hop = 0.7, popping = 0.3 }
effort = ["Punch", "Slash"]
difficulty = 0.3
nodes = "pending"

