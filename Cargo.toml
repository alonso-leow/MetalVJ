[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
glam = { version = "0.29", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"

# `scripts/studio` and `scripts/dash` always build and run `target/debug`, on
# purpose — a compile error should be a compile error, not a `--release` wait.
# But wgpu's debug build carries full validation on every submission, and
# jpeg_encoder is pure Rust with no vectorization at opt-level 0: together they
# made a single solo frame take ~200-260ms (measured), independent of grid vs
# solo — the stutter was never "other models rendering in the background",
# `Renderer::solo` only ever draws the one requested index. This crate's own
# code stays debug (fast incremental rebuilds while editing a model); only
# dependencies — wgpu, naga, jpeg_encoder among them — get optimized, which is
# where the per-frame cost actually was.
[profile.dev.package."*"]
opt-level = 3

# The launcher (`~/.local/bin/metalvj-launcher`) builds this profile for every
# new master commit. Incremental keeps a one-crate change from recompiling the
# whole `metal-dash` crate, and the dependency cache is already warm there.
[profile.release]
incremental = true
