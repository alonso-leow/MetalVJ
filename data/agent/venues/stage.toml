# Few-shot example, invented: no photo behind it. A club stage lit by four
# kinds of Godox Bluetooth light plus a pair of moving heads, and a video
# wall of three LED tiles stacked on the back wall.
#
# What this example teaches:
#
# - **A wall of screens, one picture.** The LED wall is three `[[display]]`
#   tiles (`kind = "led_wall"`), each its own `output`, stacked A over B over
#   C — 1024x256, 1024x1536, 1024x256, the heights in the ratio 256:1536:256
#   so one 1024x2048 picture runs across all three (`[[composition]]`).
# - **Bluetooth fixtures.** The keys, fills and backlights name Godox
#   Bluetooth profiles (`wire = "bluetooth"`: level only, level + colour
#   temperature, and full RGB). The moves are pan/tilt heads on DMX
#   (`moving-head-beam`); their addresses are laid one after another by the
#   venue projector, so they never overlap.
# - **A comb.** Five parallel battens above the deck (`peine`), the front and
#   rear truss spans and two towers carrying them.
#
# Units: metres, +y up, floor y = 0, the front edge of the stage at z = 0 and
# the back wall at z = -6. yaw 0 looks at the back wall (-z), +90 looks right
# (+x); pitch > 0 looks up. A surface is origin + s*u + t*v, (0,0) top-left
# seen from the side that gets light. Image points 0..1, top-left.

[venue]
id = "stage"
name = "Club stage, comb and LED wall"
setting = "indoor"
based_on = []
notes = """
Invented. A 10 x 6 m deck 1 m above the audience floor, against a 9 m back
wall. Three LED tiles fill the middle of the back wall (4 m wide, 8 m tall in
all). Two towers at the front corners carry a front and a rear truss span;
above them five parallel battens (the comb) at about 7 m. Front keys are
daylight SL60II Ds, the fills are SL60II Bis, the backlights on the rear
batten are full RGB, and four pan/tilt moving heads ride the comb battens.
"""

# ---------------------------------------------------------------- shots ---

# Designed viewpoints: exact image coordinates (a venue with an LED wall has
# no projector to measure, so the projection fields are absent and
# projector_distance is 0; the other four fields still come in order).
[[shot]]
id = "audience"
image = ""
camera = { eye = [0.0, 1.65, 7.0], yaw = 0.0, pitch = 6.0, roll = 0.0, fov = 60.0, aspect = 1.7778 }
projector_distance = 0.0
floor_brightness = 0.18
background_brightness = 0.22
horizon_path = []
notes = "Designed: standing on the audience floor, 7 m out, eyes at 1.65 m. The whole LED wall, the deck and the back wall are in frame."

[[shot.sees]]
surface = "wall-a"
corners = [[0.42881876, 0.12340462], [0.57118124, 0.12340462], [0.571729, 0.1839171], [0.42827097, 0.1839171]]

[[shot.sees]]
surface = "wall-b"
corners = [[0.42827097, 0.1839171], [0.571729, 0.1839171], [0.5752014, 0.56749773], [0.42479858, 0.56749773]]

[[shot.sees]]
surface = "wall-c"
corners = [[0.42479858, 0.56749773], [0.5752014, 0.56749773], [0.5758131, 0.6350678], [0.4241869, 0.6350678]]

[[shot.sees]]
surface = "stage-deck"
corners = [[0.3106138, 0.6350338], [0.6893862, 0.6350338], [0.85331714, 0.6731292], [0.14668283, 0.6731292]]

[[shot]]
id = "balcony"
image = ""
