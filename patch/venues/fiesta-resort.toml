# The screen: three tiles, 1024 px wide each, heights 256 : 1536 : 256, so
# each pixel is square. 1024 px = 5.05 m gives the 256-px bands 1.2625 m and
# the 1536-px main tile 7.575 m; the wall reads 5.05 m wide by 10.1 m tall.
# It stands 0.01 m proud of the back wall, centred on the room's centre line.
[[surface]]
id = "screen-top"
name = "screen, top band (256 px)"
origin = [-2.525, 10.1, -12.59]
u = [5.05, 0.0, 0.0]
v = [0.0, -1.2625, 0.0]
material = "LED panel, top band"

[[surface]]
id = "screen-main"
name = "screen, main (1536 px)"
origin = [-2.525, 8.8375, -12.59]
u = [5.05, 0.0, 0.0]
v = [0.0, -7.575, 0.0]
material = "LED panel, main"

[[surface]]
id = "screen-bottom"
name = "screen, bottom band (256 px)"
origin = [-2.525, 1.2625, -12.59]
u = [5.05, 0.0, 0.0]
v = [0.0, -1.2625, 0.0]
material = "LED panel, bottom band"

