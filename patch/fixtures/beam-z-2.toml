# beam z 2 — the second beamZ head on the Fiesta Resort rig.
#
# Its ShowXpress profile (`fixtures/beam z 2.txt`) is all `???`: the desk
# knows only that it is a 20-slot block. It is the same family as `beamz2`,
# so it borrows those named slots and keeps the 20-slot footprint.
#
# Slots are 0-based offsets from `address`.

label = "beam z 2 (beam head, 20ch)"
universe = 0
address = 1

[limits]
pan = [-270.0, 270.0]
tilt = [-135.0, 135.0]
speed = 120.0
dimmer = [0.0, 1.0]

[[channel]]
signal = "hue"
coarse = 0

[[channel]]
signal = "strobe"
coarse = 1

[[channel]]
signal = "level"
coarse = 2

[[channel]]
signal = "pan"
coarse = 9
range = [-0.5, 0.5]

[[channel]]
signal = "tilt"
coarse = 11
