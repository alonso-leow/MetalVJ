# --------------------------------------------------------------- sensors ---
#
# The USB webcam in the production room. Its `at`/`yaw`/`pitch`/`fov` are the
# same numbers as the `production` shot above, so the 3D camera the venue draws
# and the physical camera on the desk are one pose: point the real webcam from
# the operator position and the frame it delivers matches what the room expects
# to see. `capture` is the same string a graph's `capture` node carries, so the
# node and this sensor name one device.
#
# The source is a Windows DirectShow device (`dshow:<name>`). `name` is what
# `ffmpeg -list_devices true -f dshow -i dummy` prints -- replace it with the
# caption your webcam shows there (it also appears in the Settings > Sources
# list as "<name> - DirectShow"). A Linux box would use `v4l2:/dev/video0`.
[[sensor]]
id = "production-cam"
name = "production room webcam"
at = [0.0, 3.4, 15.0]
yaw = 0.0
pitch = -3.0
roll = 0.0
fov = 55.0
aspect = 1.7778
capture = "dshow:USB Video Device"
