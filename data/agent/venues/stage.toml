# ------------------------------------------------------------- surfaces ---

[[surface]]
id = "back-wall"
name = "back wall"
origin = [-5.0, 9.0, -6.0]
u = [10.0, 0.0, 0.0]
v = [0.0, -9.0, 0.0]
material = "matte black"

[[surface]]
id = "stage-deck"
name = "stage deck"
origin = [-5.0, 1.0, -6.0]
u = [10.0, 0.0, 0.0]
v = [0.0, 0.0, 6.0]
material = "black marley"

[[surface]]
id = "audience-floor"
name = "audience floor"
origin = [-5.0, 0.0, 10.0]
u = [10.0, 0.0, 0.0]
v = [0.0, 0.0, -10.0]
material = "concrete"

# The LED wall: three tiles 4 m wide, 1 cm proud of the back wall, stacked A
# over B over C with heights 1 : 6 : 1 (the ratio 256 : 1536 : 256), so the
# 1024-px width and the 2048-px total height keep square pixels.
[[surface]]
id = "wall-a"
name = "LED wall, top band"
origin = [-2.0, 9.0, -5.99]
u = [4.0, 0.0, 0.0]
v = [0.0, -1.0, 0.0]
material = "LED panel, top band"

[[surface]]
id = "wall-b"
name = "LED wall, main"
origin = [-2.0, 8.0, -5.99]
u = [4.0, 0.0, 0.0]
v = [0.0, -6.0, 0.0]
material = "LED panel, main"

[[surface]]
id = "wall-c"
name = "LED wall, bottom band"
origin = [-2.0, 2.0, -5.99]
u = [4.0, 0.0, 0.0]
v = [0.0, -1.0, 0.0]
material = "LED panel, bottom band"

