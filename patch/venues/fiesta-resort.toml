# Corner order is (0,0) (1,0) (1,1) (0,1) of each surface, reprojected
# through the `audience` camera above and the venue's own geometry: these are
# the numbers `Venue::check` re-derives, not estimates. The deck's near
# corners fall outside the frame (the deck runs back under the camera's eye
# line), so they are reported past the edge, which the check allows.
[[shot.sees]]
surface = "screen-top"
corners = [[0.44031862, 0.25301551], [0.55968138, 0.25301551], [0.56011224, 0.30426795], [0.43988776, 0.30426795]]

[[shot.sees]]
surface = "screen-main"
corners = [[0.43988776, 0.30426795], [0.56011224, 0.30426795], [0.56283392, 0.62802637], [0.43716608, 0.62802637]]

[[shot.sees]]
surface = "screen-bottom"
corners = [[0.43716608, 0.62802637], [0.56283392, 0.62802637], [0.56331168, 0.68485808], [0.43668832, 0.68485808]]

[[shot.sees]]
surface = "stage-deck"
corners = [[0.26904176, 0.64063157], [0.73095824, 0.64063157], [1.08088656, 0.68589862], [-0.08088656, 0.68589862]]

