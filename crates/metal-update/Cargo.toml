[package]
name = "metal-update"
version.workspace = true
edition.workspace = true
license.workspace = true

# **No git.** This crate downloads a published binary from GitHub Releases; it
# never runs `git`, never reads a checkout and never merges. The hotel patch
# (`docs/patch-and-update-plan.md` §0) lives in a clone with *no* shared
# ancestry with the public repo, so an updater that thought in commits could
# only ever produce a conflict. It thinks in release assets instead.
#
# **No new dependency is installed by this crate; two already in `Cargo.lock`
# are named directly.** `ureq` 3.4.1 is in the lockfile as a *build*-dependency
# (`ort-sys`, ONNX's prebuilt download) and takes its build-dependency graph
# with it; built with `default-features = false, features = ["rustls"]` it is the
# `rustls` + `ring` + `webpki-roots` stack the lockfile already carries (see
# `metal-agent`'s own `Cargo.toml`, which names the identical three for its
# provider turns). `sha2` 0.10 is in the lockfile via `metal-ml`. `reqwest` is
# far bigger and on this target set is only reached through `iroh` — a QUIC
# crate whose HTTP client is not a surface this crate should be borrowing.
# The lockfile gains exactly one entry: this crate.
[dependencies]
# The file door: std::fs natively, the in-memory tree on wasm (see crates/metal-vfs).
metal-vfs = { path = "../metal-vfs" }
# The one config file the workspace has (`~/.config/metalvj/config.toml`): the
# updater's settings are a table in it, never a second file — see
# `UpdateConfig::load`.
metal-config = { path = "../metal-config" }
serde = { workspace = true }
serde_json = { workspace = true }
# The config file's format, for the one table this crate reads; the workspace's
# pinned `toml`, nothing new.
toml = { workspace = true }
thiserror = { workspace = true }
# HTTPS for the GitHub API and the release asset. Pinned to the 3.4.1 line the
# lockfile already resolved; `rustls` (not `native-tls`) keeps the TLS provider
# the rest of the tree uses (ring + webpki-roots, no system CA story to own).
# Asset digests. GitHub's `digest` field is `sha256:<hex>`. Pure Rust, already
# in the lockfile (`metal-ml`).
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

# Native only: the browser reloads instead of updating (`http::*` answer so).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { version = "3", default-features = false, features = ["rustls"] }
